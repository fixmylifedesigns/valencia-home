name: Refresh listings and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IDEALISTA_API_KEY: ${{ secrets.IDEALISTA_API_KEY }}
      IDEALISTA_API_SECRET: ${{ secrets.IDEALISTA_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund

      - name: Refresh listings from idealista
        if: env.IDEALISTA_API_KEY != ''
        run: npm run refresh

      - name: Commit refreshed data
        if: env.IDEALISTA_API_KEY != ''
        run: |
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add data/listings.json
          git diff --cached --quiet || (git commit -m "Refresh listings [skip ci]" && git push)

      - name: Build static site
        run: |
          cp data/listings.json public/listings.json
          npm run build
          touch out/.nojekyll
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
